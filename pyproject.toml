[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dj-figpack-codecs"
description = "DataJoint codec for storing figpack visualizations in schema-addressed OAS"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
authors = [
    { name = "DataJoint", email = "info@datajoint.com" }
]
keywords = ["datajoint", "figpack", "visualization", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "datajoint>=2.0",
    "figpack>=0.3",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
]
dev = [
    "dj-figpack-codecs[test]",
    "black>=24.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/datajoint/dj-figpack-codecs"
Documentation = "https://github.com/datajoint/dj-figpack-codecs#readme"
Repository = "https://github.com/datajoint/dj-figpack-codecs"
Issues = "https://github.com/datajoint/dj-figpack-codecs/issues"

[project.entry-points."datajoint.codecs"]
figpack = "dj_figpack_codecs:FigpackCodec"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dj_figpack_codecs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ["py310"]

# The git tag is the single source of truth for the version — mirrors dj-zarr-codecs.
# The build hook writes _version.py, which the package imports, so nothing declares a
# version twice and nothing needs bumping in a pull request.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/dj_figpack_codecs/_version.py"
