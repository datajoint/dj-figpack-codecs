name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  # The CD workflow runs this as the test gate of a release.
  workflow_call:

concurrency:
  # "CI" rather than github.workflow, which in a run called from CD is "CD":
  # sharing the caller's group is a deadlock, and GitHub cancels the run.
  group: CI-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  FORCE_COLOR: 3

jobs:
  tests:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest Python the package supports. The live round-trip
        # test needs a database server and skips itself without DJ_HOST.
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # hatch-vcs derives the version from the tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: python -m pip install ".[test]"

      - name: Test the package
        run: python -m pytest -ra
